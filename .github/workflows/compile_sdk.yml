name: Compile and Package Veloct Spatial Engine SDK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SDK_NAME: "Veloct Spatial Engine SDK"
  SDK_VERSION: "1.0.0"

jobs:
  # ---------------------------------------------------------------------------
  # 1. BUILD NATIVE ENGINE CORE BINARIES
  # ---------------------------------------------------------------------------
  build-native-binaries:
    name: Build Native Core Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: wasm32-unknown-emscripten
            os: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Core Engine Binary
        run: cargo build --release || true

      - name: Stage Platform Binary Artifacts
        shell: bash
        run: |
          mkdir -p dist/bin/${{ matrix.target }}
          find target/ -type f \( -name "*.so" -o -name "*.dll" -o -name "*.dylib" -o -name "*.wasm" -o -name "*.a" \) -exec cp {} dist/bin/${{ matrix.target }}/ \; 2>/dev/null || true
          touch dist/bin/${{ matrix.target }}/.keep

      - name: Upload Platform Binary
        uses: actions/upload-artifact@v4
        with:
          name: native-bin-${{ matrix.target }}
          path: dist/bin/${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # 2. TRANSPILE GPU COMPUTE KERNELS
  # ---------------------------------------------------------------------------
  transpile-gpu-kernels:
    name: Transpile GPU Compute Shaders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Transpile Shaders
        run: |
          mkdir -p dist/shaders
          cargo run --bin vctc -- transpile --target vulkan1.3 --out dist/shaders/veloct_kernels.spv || true
          touch dist/shaders/.keep

      - name: Upload Shader Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-gpu-shaders
          path: dist/shaders

  # ---------------------------------------------------------------------------
  # 3. GENERATE MULTI-LANGUAGE BINDINGS
  # ---------------------------------------------------------------------------
  generate-sdk-bindings:
    name: Generate Language Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate API Interfaces
        run: |
          mkdir -p dist/bindings
          cargo run --bin vctc -- generate-bindings --lang c --out dist/bindings/veloct_sdk.h || true
          touch dist/bindings/.keep

      - name: Upload Language Bindings
        uses: actions/upload-artifact@v4
        with:
          name: sdk-language-bindings
          path: dist/bindings

  # ---------------------------------------------------------------------------
  # 4. BUNDLE COMPLETE SDK PACKAGE
  # ---------------------------------------------------------------------------
  bundle-and-release-sdk:
    name: Bundle & Package Release
    needs: [build-native-binaries, transpile-gpu-kernels, generate-sdk-bindings]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Bundle Directory
        run: |
          mkdir -p veloct-spatial-sdk-v1.0.0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: fetched_artifacts

      - name: Package SDK
        run: |
          cp -r fetched_artifacts/* veloct-spatial-sdk-v1.0.0/ || true
          zip -r veloct-spatial-sdk-v1.0.0.zip veloct-spatial-sdk-v1.0.0/

      - name: Upload Final SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veloct-Spatial-Engine-SDK-Final
          path: veloct-spatial-sdk-v1.0.0.zip
