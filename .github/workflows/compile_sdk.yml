name: Compile and Package Veloct Spatial Engine SDK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SDK_NAME: "Veloct Spatial Engine SDK"
  SDK_VERSION: "1.0.0"
  LICENSE_NAME: "Business Source License 1.1"
  COPYRIGHT_HOLDER: "Mind Spark"
  SUPPORT_EMAIL: "mindsparkceo@gmail.com"

jobs:
  # ---------------------------------------------------------------------------
  # 1. BUILD NATIVE ENGINE CORE BINARIES (MULTI-PLATFORM)
  # ---------------------------------------------------------------------------
  build-native-binaries:
    name: Build Native Dynamic/Static Libraries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: wasm32-unknown-emscripten
            os: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Extra target setup for WebAssembly
      - name: Setup Emscripten (WASM)
        if: matrix.target == 'wasm32-unknown-emscripten'
        uses: mymindstorm/setup-emsdk@v12

      # Extra target setup for Android
      - name: Setup Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: nsetup/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Core Engine Binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Stage Platform Binary Artifacts
        shell: bash
        run: |
          mkdir -p dist/bin/${{ matrix.target }}
          find target/${{ matrix.target }}/release -maxdepth 1 \( -name "*.so" -o -name "*.dll" -o -name "*.dylib" -o -name "*.wasm" -o -name "*.a" \) -exec cp {} dist/bin/${{ matrix.target }}/ \; 2>/dev/null || true

      - name: Upload Platform Binary
        uses: actions/upload-artifact@v4
        with:
          name: native-bin-${{ matrix.target }}
          path: dist/bin/${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # 2. TRANSPILE GPU COMPUTE KERNELS (.vct -> SPIR-V / Metal / HLSL)
  # ---------------------------------------------------------------------------
  transpile-gpu-kernels:
    name: Transpile GPU Compute Shaders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Transpile .vct Shaders to SPIR-V, Metal, and HLSL
        run: |
          mkdir -p dist/shaders
          cargo run --bin vctc -- transpile --target vulkan1.3 --out dist/shaders/veloct_kernels.spv || true
          cargo run --bin vctc -- transpile --target metal2.4 --out dist/shaders/veloct_kernels.metal || true
          cargo run --bin vctc -- transpile --target hlsl6.6 --out dist/shaders/veloct_kernels.hlsl || true

      - name: Upload Shader Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-gpu-shaders
          path: dist/shaders

  # ---------------------------------------------------------------------------
  # 3. GENERATE MULTI-LANGUAGE BINDINGS
  # ---------------------------------------------------------------------------
  generate-sdk-bindings:
    name: Generate Language Bindings (C++, Rust, Dart, Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Multi-Language API Interfaces
        run: |
          mkdir -p dist/bindings/{c_cpp,rust,dart,python}
          cargo run --bin vctc -- generate-bindings --lang c --out dist/bindings/c_cpp/veloct_sdk.h || true
          cargo run --bin vctc -- generate-bindings --lang rust --out dist/bindings/rust || true
          cargo run --bin vctc -- generate-bindings --lang dart --out dist/bindings/dart || true
          cargo run --bin vctc -- generate-bindings --lang python --out dist/bindings/python || true

      - name: Upload Language Bindings
        uses: actions/upload-artifact@v4
        with:
          name: sdk-language-bindings
          path: dist/bindings

  # ---------------------------------------------------------------------------
  # 4. BUNDLE COMPLETE SDK PACKAGE & INJECT CUSTOM BSL 1.1 LICENSE
  # ---------------------------------------------------------------------------
  bundle-and-release-sdk:
    name: Bundle & Package Release
    needs: [build-native-binaries, transpile-gpu-kernels, generate-sdk-bindings]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Bundle Directory Structure
        run: |
          mkdir -p veloct-spatial-sdk-v1.0.0/{bin,bindings,shaders,include}

      - name: Download All Native & Cross-Compiled Artifacts
        uses: actions/download-artifact@v4
        with:
          path: fetched_artifacts

      - name: Assemble Final SDK Folder Structure
        run: |
          cp -r fetched_artifacts/* veloct-spatial-sdk-v1.0.0/

      - name: Inject Custom BSL 1.1 License File
        run: |
          cat << 'EOF' > veloct-spatial-sdk-v1.0.0/LICENSE
          BUSINESS SOURCE LICENSE 1.1

          Free for personal use, education, and open source projects.
          Commercial use requires a paid license from mind spark.

          Contact: [mindsparkceo@gmail.com]
          Copyright 2026 Mind Spark
          EOF

      - name: Compress SDK Distribution Archive
        run: |
          zip -r veloct-spatial-sdk-v1.0.0.zip veloct-spatial-sdk-v1.0.0/

      - name: Upload SDK Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veloct-Spatial-Engine-SDK-Final
          path: veloct-spatial-sdk-v1.0.0.zip
